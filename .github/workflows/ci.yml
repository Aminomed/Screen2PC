name: Build & Test Screen2PC (Windows x64)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK & SDK NuGet packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Expose WDK NuGet Tools to MSBuild
        shell: pwsh
        run: |
          $stamp = Get-ChildItem -Path "packages" -Filter "stampinf.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if (-not $stamp) {
            $stamp = Get-ChildItem -Path "packages" -Filter "stampinf.exe" -Recurse | Select-Object -First 1
          }
          if ($stamp) {
            Write-Host "Using WDK tools from: $($stamp.Directory.FullName)"
            $stamp.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Solution (Release|x64)
        run: msbuild Screen2PC.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Run Automated Unit & Integration Tests
        run: .\out\Release\x64\Screen2PC.Tests.exe

      - name: Validate INF & Generate Driver Catalog (Inf2Cat)
        shell: pwsh
        run: |
          $drvOut = "out\Release\x64\driver"
          $infFile = Get-ChildItem -Path $drvOut -Filter "*.inf" -Recurse | Select-Object -First 1
          if (-not $infFile) { throw "No INF found under $drvOut" }
          $pkgDir = $infFile.Directory.FullName
          Write-Host "Driver package dir: $pkgDir"

          $inf2cat = Get-ChildItem -Path "packages" -Filter "Inf2Cat.exe" -Recurse | Select-Object -First 1
          $infverif = Get-ChildItem -Path "packages" -Filter "infverif.exe" -Recurse | Select-Object -First 1

          if ($infverif) {
            Write-Host "Running $($infverif.FullName) on $($infFile.FullName)"
            & $infverif.FullName /v $infFile.FullName
            if ($LASTEXITCODE -ne 0) { throw "infverif failed with exit code $LASTEXITCODE" }
          } else {
            Write-Host "infverif.exe not found in NuGet packages; skipping."
          }

          if ($inf2cat) {
            Write-Host "Running $($inf2cat.FullName) /driver:$pkgDir /os:10_VB_X64,10_CO_X64,10_NI_X64"
            & $inf2cat.FullName "/driver:$pkgDir" "/os:10_VB_X64,10_CO_X64,10_NI_X64" "/uselocaltime"
            if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed with exit code $LASTEXITCODE" }
          } else {
            Write-Warning "Inf2Cat.exe not found in NuGet packages."
          }

      - name: Package Release Bundle
        shell: pwsh
        run: |
          $dist = "dist\Screen2PC-Windows-x64"
          $drvDist = Join-Path $dist "driver"
          New-Item -ItemType Directory -Path $drvDist -Force | Out-Null

          Copy-Item "out\Release\x64\Screen2PC.Sender.exe" $dist
          Copy-Item "out\Release\x64\Screen2PC.Receiver.exe" $dist
          Copy-Item "out\Release\x64\Screen2PC.DriverSetup.exe" $dist
          Copy-Item "out\Release\x64\Screen2PC.Tests.exe" $dist

          $drvOut = "out\Release\x64\driver"
          Get-ChildItem -Path $drvOut -Include *.dll,*.inf,*.cat -Recurse | ForEach-Object {
            Copy-Item $_.FullName $drvDist -Force
          }

          Copy-Item "scripts\install_driver.ps1" $dist
          Copy-Item "scripts\uninstall_driver.ps1" $dist
          Copy-Item "README.md" $dist

          Compress-Archive -Path "$dist\*" -DestinationPath "dist\Screen2PC-Windows-x64.zip" -Force
          Get-ChildItem -Path $dist -Recurse

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $verHeader = Get-Content -Path "src\common\Version.h" -Raw
          $maj = [regex]::Match($verHeader, '#define\s+SCREEN2PC_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $min = [regex]::Match($verHeader, '#define\s+SCREEN2PC_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $pat = [regex]::Match($verHeader, '#define\s+SCREEN2PC_VERSION_PATCH\s+(\d+)').Groups[1].Value
          if (-not $maj -or -not $min -or -not $pat) {
            throw "Failed to parse version macros from src\common\Version.h"
          }
          $ver = "$maj.$min.$pat.$env:GITHUB_RUN_NUMBER"
          "SCREEN2PC_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            Write-Host "Installing Inno Setup 6 via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup." }

          $distAbs = (Resolve-Path "dist\Screen2PC-Windows-x64").Path
          $outAbs = (Resolve-Path "dist").Path
          $repoAbs = (Resolve-Path ".").Path

          Write-Host "Compiling installer v$ver with $iscc..."
          & $iscc "/DAppVersion=$ver" "/DDistDir=$distAbs" "/DOutDir=$outAbs" "/DRepoRoot=$repoAbs" "installer\Screen2PC.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\Screen2PC-Setup-x64.exe")) { throw "Screen2PC-Setup-x64.exe not generated" }
          Get-Item "dist\Screen2PC-Setup-x64.exe"

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screen2PC-Windows-x64
          path: |
            dist/Screen2PC-Windows-x64.zip
            dist/Screen2PC-Setup-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:SCREEN2PC_VER
          if (-not $ver) { throw "SCREEN2PC_VER missing from environment" }
          $tag = "v$ver"
          $zip = "dist\Screen2PC-Windows-x64.zip"
          $setupExe = "dist\Screen2PC-Setup-x64.exe"
          Write-Host "Publishing GitHub Release $tag ($setupExe + $zip) for $env:GITHUB_REPOSITORY..."

          $notes = @(
            "Automatischer Screen2PC Windows x64 Release-Build (**v$ver**).",
            "",
            "- **Installer (``Screen2PC-Setup-x64.exe``):** Gefuehrte Installation fuer Laptop (Sender + VDD-Treiber + Akku-fester Autostart) oder PC (Empfaenger — 100 % treiberfrei + Firewall + Autostart)",
            "- **Portable (``Screen2PC-Windows-x64.zip``):** Fuer portablen Einsatz & den integrierten 1-Klick GitHub Auto-Updater",
            "- Alle C++ Unit- & Integrations-Tests bestanden",
            "- UMDF v2 IddCx Treiberpaket via ``infverif.exe`` und ``Inf2Cat.exe`` geprueft"
          ) -join "`n"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setupExe $zip --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Screen2PC $tag" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
          } else {
            gh release create $tag $setupExe $zip --repo $env:GITHUB_REPOSITORY --title "Screen2PC $tag" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
